services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Retenção curta por padrão — documentos com CPF e salário não devem
      # sobreviver mais do que o necessário para o ciclo enviar→revisar→baixar.
      - STORAGE_DIR=/app/data
      - RETENTION_MINUTES=60
      - SWEEP_SECONDS=300
      - MAX_UPLOAD_MB=20
      - MAX_PAGES=60
      - MAX_CONCURRENT_JOBS=2
      - JOB_TIMEOUT_SECONDS=900
      - OCR_ENABLED=true
      - OCR_LANG=por
      - OCR_DPI=300
      - LOG_LEVEL=INFO
    volumes:
      - dados:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  dados:
