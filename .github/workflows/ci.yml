name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-e-testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      # OCR não entra no CI: os testes de extração usam PDFs sintéticos com
      # camada de texto (tests/helpers.py), então não dependem do binário do
      # Tesseract. Cobrir OCR de verdade fica para o smoke test manual da
      # imagem Docker, que já instala o Tesseract.
      - name: Testes (pytest)
        run: pytest -q
